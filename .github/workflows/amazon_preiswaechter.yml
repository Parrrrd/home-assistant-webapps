name: amazon_preiswaechter

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Image veröffentlichen
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: amazon_preiswaechter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-addon-build.yml
    with:
      app_directory: amazon_preiswaechter
      architectures: '["amd64"]'
      image_name: amazon_preiswaechter
      publish: ${{ inputs.publish }}
    secrets: inherit
