name: mietbewerber_manager

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Image veröffentlichen
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: mietbewerber_manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-addon-build.yml
    with:
      app_directory: mietbewerber_manager
      architectures: '["amd64", "aarch64"]'
      image_name: mietbewerber_manager
      publish: ${{ inputs.publish }}
    secrets: inherit
