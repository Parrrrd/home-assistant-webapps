name: Google-Drive-Import

on:
  repository_dispatch:
    types: [google_drive_package]
  schedule:
    # Rückfallebene, falls die direkte Drive-Benachrichtigung einmal ausbleibt.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: google-drive-import
  cancel-in-progress: false

jobs:
  import:
    name: Neues Quellpaket übernehmen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write

    steps:
      # Geheimnisse dürfen in GitHub nicht direkt in einer if-Bedingung stehen.
      # Daher wird die noch nicht eingerichtete Brücke sauber übersprungen.
      - id: configuration
        name: Drive-Zugang prüfen
        env:
          GOOGLE_DRIVE_IMPORTER_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_IMPORTER_CREDENTIALS }}
          GOOGLE_DRIVE_IMPORT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_IMPORT_FOLDER_ID }}
        run: |
          if [ -z "$GOOGLE_DRIVE_IMPORTER_CREDENTIALS" ] || [ -z "$GOOGLE_DRIVE_IMPORT_FOLDER_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Google-Drive-Import ist noch nicht eingerichtet; Lauf wird übersprungen."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.configuration.outputs.configured == 'true'
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.configuration.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Importer-Logik testen
        if: steps.configuration.outputs.configured == 'true'
        run: node --test scripts/test-download-google-drive-package.js

      - id: download
        name: Nächstes offenes Paket aus dem Codeeingang laden
        if: steps.configuration.outputs.configured == 'true'
        env:
          GOOGLE_DRIVE_IMPORTER_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_IMPORTER_CREDENTIALS }}
          GOOGLE_DRIVE_IMPORT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_IMPORT_FOLDER_ID }}
        run: >-
          node scripts/download-google-drive-package.js
          "$GOOGLE_DRIVE_IMPORT_FOLDER_ID"
          "$RUNNER_TEMP/google-drive-source"
          "${{ github.event.client_payload.file_id || '' }}"

      - id: import
        name: Quelländerung prüfen und übernehmen
        if: steps.configuration.outputs.configured == 'true'
        env:
          PACKAGE_NAME: ${{ steps.download.outputs.package_name }}
          PACKAGE_TYPE: ${{ steps.download.outputs.package_type }}
        run: |
          case "$PACKAGE_TYPE" in
            zip)
              sh scripts/import-google-drive-package.sh "$RUNNER_TEMP/google-drive-source" "$PACKAGE_NAME"
              ;;
            patch)
              sh scripts/import-google-drive-patch.sh "$RUNNER_TEMP/google-drive-source" "$PACKAGE_NAME"
              ;;
            *)
              echo "Unbekanntes Übergabeformat." >&2
              exit 1
              ;;
          esac

      - name: Importierte App testen
        if: steps.import.outputs.imported == 'true'
        env:
          APP_DIRECTORY: ${{ steps.import.outputs.app_directory }}
        run: |
          case "$APP_DIRECTORY" in
            einkaufsliste)
              node --test einkaufsliste/app/test-core.js einkaufsliste/app/test-icon-lifecycle.js einkaufsliste/app/test-category-suffix.js einkaufsliste/app/test-structured-import.js
              ;;
            alexa_bring_sync)
              node --test alexa_bring_sync/app/test-notification-assets.js alexa_bring_sync/app/test-notification-routing.js alexa_bring_sync/app/test-sync-logic.js
              ;;
            *)
              sh ./scripts/check-repository-safety.sh
              ;;
          esac

      - name: Übernahme nach GitHub senden
        if: steps.import.outputs.imported == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.import.outputs.version }}
          APP_DIRECTORY: ${{ steps.import.outputs.app_directory }}
        run: |
          git config user.name "home-assistant-webapps bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APP_DIRECTORY"
          git commit -m "Import $APP_DIRECTORY $VERSION aus Google Drive"
          git config credential.helper '!f() { echo username=x-access-token; echo password=$PUSH_TOKEN; }; f'
          GIT_TERMINAL_PROMPT=0 git push origin HEAD:main

      - name: Image-Build starten
        if: steps.import.outputs.imported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_DIRECTORY: ${{ steps.import.outputs.app_directory }}
        run: >-
          gh workflow run "${APP_DIRECTORY}.yml"
          --ref main
          --field publish=true