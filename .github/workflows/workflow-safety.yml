name: Workflow-Sicherheitsprüfung

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-repository-safety.sh'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-repository-safety.sh'

permissions: {}

jobs:
  check:
    name: Gemeinsame Workflow-Regeln prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rechte und Lieferkettenregeln prüfen
        run: sh ./scripts/check-repository-safety.sh
