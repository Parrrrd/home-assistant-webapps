name: stundenplanung

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Image veröffentlichen
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: stundenplanung-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-addon-build.yml
    with:
      app_directory: stundenplanung
      architectures: '["aarch64", "amd64"]'
      image_name: stundenplanung
      publish: ${{ inputs.publish }}
    secrets: inherit
