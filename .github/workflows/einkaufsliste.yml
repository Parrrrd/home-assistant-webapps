name: Einkaufsliste

on:
  push:
    branches: [main]
    paths:
      - 'einkaufsliste/**'
      - '.github/workflows/einkaufsliste.yml'
  pull_request:
    paths:
      - 'einkaufsliste/**'
      - '.github/workflows/einkaufsliste.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: einkaufsliste-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ghcr.io/${{ github.repository }}/einkaufsliste

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App-Tests ausführen
        run: npm test --prefix einkaufsliste
      - name: Keine Laufzeitdaten oder Schlüssel verfolgen
        run: sh ./scripts/check-repository-safety.sh

  prepare:
    name: Image-Build vorbereiten
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: App-Version lesen
        run: |
          echo "value=$(grep '^version: ' einkaufsliste/config.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Architektur-Matrix erzeugen
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: ${{ matrix.arch }}-Image veröffentlichen
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen und veröffentlichen
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Mehrarch-Image veröffentlichen
    needs: [prepare, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Gemeinsames Mehrarch-Image veröffentlichen
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
