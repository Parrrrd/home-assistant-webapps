name: Einkaufsliste

on:
  push:
    branches: [main]
    paths:
      - 'einkaufsliste/**'
      - '.github/workflows/einkaufsliste.yml'
  pull_request:
    paths:
      - 'einkaufsliste/**'
      - '.github/workflows/einkaufsliste.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: einkaufsliste-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App-Tests ausführen
        run: npm test --prefix einkaufsliste
      - name: Keine Laufzeitdaten oder Schlüssel verfolgen
        run: sh ./scripts/check-repository-safety.sh

  publish:
    name: Mehrarch-Image veröffentlichen
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        name: App-Version lesen
        run: |
          echo "value=$(grep '^version: ' einkaufsliste/config.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./einkaufsliste
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository }}/einkaufsliste:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}/einkaufsliste:latest
