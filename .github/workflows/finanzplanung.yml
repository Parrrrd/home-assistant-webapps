name: finanzplanung

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Image veröffentlichen
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: finanzplanung-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-addon-build.yml
    with:
      app_directory: finanzplanung
      architectures: '["aarch64", "amd64"]'
      image_name: finanzplanung
      publish: ${{ inputs.publish }}
    secrets: inherit
