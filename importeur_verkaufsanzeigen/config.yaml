name: "Importeur Verkaufsanzeigen"
version: 0.1.3
slug: "importeur_verkaufsanzeigen"
description: "Fotos und manuelle Artikeldetails für spätere Verkaufsanzeigen erfassen und sicher an Google Drive übergeben."
image: ghcr.io/parrrrd/home-assistant-webapps/importeur_verkaufsanzeigen-private
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8162]/"
ports:
  8162/tcp: 8162
ports_description:
  8162/tcp: "Erfassungsoberfläche"
options:
  retry_interval_minutes: 5
schema:
  retry_interval_minutes: int(1,60)
