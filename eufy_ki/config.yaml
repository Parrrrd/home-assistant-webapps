name: "Eufy KI – Ereignisse & Personen"
version: "0.1.0"
slug: "eufy_ki"
description: "Gemini Flash Bildbeschreibung und lokal lernende Gesichtserkennung für bestehende Eufy-Ereignisbilder"
arch:
  - amd64
image: ghcr.io/parrrrd/home-assistant-webapps/eufy_ki-private
startup: application
boot: manual
init: false
webui: "http://[HOST]:[PORT:8781]/"
ports:
  8781/tcp: 8781
ports_description:
  8781/tcp: "Passwortgeschützte Oberfläche im lokalen Netzwerk"
map:
  - type: media
    read_only: true
options:
  ui_password: ""
  gemini_api_key: ""
  gemini_model: ""
  retention_days: 14
  retention_max_events: 250
schema:
  ui_password: password
  gemini_api_key: password
  gemini_model: str
  retention_days: int(1,90)
  retention_max_events: int(20,2000)
