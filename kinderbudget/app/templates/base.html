<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1730">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Kinder-Finanzen">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='icons/icon-512.png') }}">
    <title>{% block title %}Kinder-Finanzen{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="page-{{ active_page|default('default') }}">
    <header class="topbar">
      <div class="topbar-shell topbar-shell--with-actions">
        <div class="topbar-title-wrap">
          <div class="topbar-title">{% block header_title %}Kinder-Finanzen{% endblock %}</div>

        </div>
        {% if active_page in ['child', 'overview'] %}
        <button class="topbar-refresh-button" type="button" onclick="window.location.reload();" aria-label="Aktualisieren" title="Aktualisieren">
          ↻
        </button>
        {% endif %}
      </div>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    {% block bottom_nav %}{% endblock %}
  </body>
</html>
