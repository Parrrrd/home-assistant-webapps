name: Einkaufsliste
version: 0.3.62
slug: eigene_einkaufsliste
description: Mobile Einkaufsliste mit Kategorien, Mengen und Produktkatalog.
image: ghcr.io/parrrrd/home-assistant-webapps/einkaufsliste
