name: "Vinted Manager"
version: 0.13.178
slug: "vinted_manager"
description: "Vinted-Anzeigen lokal vorbereiten, strukturierte Vinted-Daten nutzen und nach ausdruecklicher Bestaetigung ueber die angemeldete Chromium-Sitzung veroeffentlichen."
image: ghcr.io/parrrrd/home-assistant-webapps/vinted_manager-private
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8153]/"
ports:
  8153/tcp: 8153
  6081/tcp: 6081
ports_description:
  8153/tcp: "Weboberflaeche"
  6081/tcp: "Vinted-Anmeldefenster"
homeassistant_api: true
options:
  notify_service: ""
  browser_idle_sleep: false
  push_public_host: ""
  vinted_email: ""
  vinted_password: ""
schema:
  notify_service: str?
  browser_idle_sleep: bool?
  push_public_host: str?
  vinted_email: str
  vinted_password: password
# Nicht in Home-Assistant-Backups: interne Sicherungen (bleiben auf dem Geraet) und Chromium-Zwischenspeicher
backup_exclude:
  - "*vinted_manager/backups"
  - "*browser-profile/Default/Cache"
  - "*browser-profile/Default/Code Cache"
  - "*browser-profile/Default/GPUCache"
  - "*browser-profile/Default/DawnCache"
  - "*browser-profile/Default/DawnGraphiteCache"
  - "*browser-profile/Default/DawnWebGPUCache"
  - "*browser-profile/Default/Service Worker"
  # 04.10.2026: Chromium schrieb während der Sicherung in IndexedDB, die Sicherung brach ab und
  # blockierte das Update. Enthält nur Website-Zwischenspeicher; die Anmeldung liegt in den Cookies.
  - "*browser-profile/Default/IndexedDB"
  - "*browser-profile/GrShaderCache"
  - "*browser-profile/ShaderCache"
  - "*browser-profile/GraphiteDawnCache"
  - "*browser-profile/component_crx_cache"
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
