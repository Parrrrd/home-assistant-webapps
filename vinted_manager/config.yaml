name: "Vinted Manager"
version: 0.13.125
slug: "vinted_manager"
description: "Vinted-Anzeigen lokal vorbereiten, strukturierte Vinted-Daten nutzen und nach ausdruecklicher Bestaetigung ueber die angemeldete Chromium-Sitzung veroeffentlichen."
image: ghcr.io/parrrrd/home-assistant-webapps/vinted_manager
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8153]/"
ports:
  8153/tcp: 8153
  6081/tcp: 6081
ports_description:
  8153/tcp: "Weboberflaeche"
  6081/tcp: "Vinted-Anmeldefenster"
homeassistant_api: true
options:
  notify_service: ""
  browser_idle_sleep: true
  push_public_host: ""
schema:
  notify_service: str?
  browser_idle_sleep: bool?
  push_public_host: str?
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
