name: "Packliste"
version: 0.1.2
slug: "packliste"
description: "Gemeinsame Familien-Packliste: jede Reise mit eigener Liste, Abgleich mit dem letzten Urlaub und Home-Assistant-Vorbereitung"
image: ghcr.io/parrrrd/home-assistant-webapps/packliste-private
arch:
  - amd64
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8174]/"
homeassistant_api: true
hassio_api: false
ports:
  8174/tcp: 8174
ports_description:
  8174/tcp: "Direkte Weboberfläche der Packliste"
watchdog: "http://[HOST]:[PORT:8174]/api/health"
backup: hot
options:
  shortcut_token: ""
  notify_services: ""
  caldav_enabled: false
  caldav_url: ""
  caldav_username: ""
  caldav_password: ""
  caldav_sync_interval_seconds: 60
schema:
  shortcut_token: password
  notify_services: "str?"
  caldav_enabled: bool
  caldav_url: str
  caldav_username: str
  caldav_password: password
  caldav_sync_interval_seconds: int
