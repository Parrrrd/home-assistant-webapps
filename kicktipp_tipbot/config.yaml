name: Kicktipp TipBot
version: 0.1.43
slug: kicktipp_tipbot
description: Kicktipp-Ausfüllhelfer mit automatischem Google-Drive-Import und manuellem Tipp-Codeblock
url: "https://www.kicktipp.de/"
image: ghcr.io/parrrrd/home-assistant-webapps/kicktipp_tipbot
arch:
  - amd64
startup: services
boot: auto
init: false
webui: "http://[HOST]:[PORT:8148]/"
map:
  - share:rw
  - config:rw
  - media:rw
homeassistant_api: true
ports:
  8148/tcp: 8148
ports_description:
  8148/tcp: Weboberfläche
options:
