<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kicktipp Bot für secondary</title>
  <style>
    :root { --bg:#0b1220; --card:#131d2f; --muted:#93a4bd; --text:#eef4ff; --accent:#5bbcff; --bad:#ff7272; --good:#63d471; --warn:#ffd166; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:linear-gradient(135deg,#08101f,#14213d); color:var(--text); }
    main { max-width:960px; margin:0 auto; padding:28px 16px 48px; }
    h1 { margin:0 0 8px; font-size:28px; }
    h2 { margin-top:0; }
    p { color:var(--muted); line-height:1.45; }
    .card { background:rgba(19,29,47,.94); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:18px; box-shadow:0 16px 50px rgba(0,0,0,.25); margin-bottom:16px; }
    label { display:block; font-weight:650; margin:0 0 7px; }
    textarea { width:100%; border:1px solid rgba(255,255,255,.16); background:#0d1728; color:var(--text); border-radius:12px; padding:11px 12px; font-size:15px; outline:none; min-height:340px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; line-height:1.5; }
    textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,188,255,.15); }
    button { border:0; border-radius:12px; padding:12px 16px; cursor:pointer; font-weight:750; background:var(--accent); color:#07111f; min-width:130px; }
    button.secondary { background:#26364f; color:var(--text); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
    .status { white-space:pre-wrap; border-radius:12px; padding:12px; background:#0d1728; border:1px solid rgba(255,255,255,.08); min-height:72px; color:var(--muted); overflow:auto; }
    .ok { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); }
    table { width:100%; border-collapse:collapse; margin-top:10px; overflow:hidden; border-radius:12px; }
    th,td { text-align:left; border-bottom:1px solid rgba(255,255,255,.08); padding:8px; font-size:14px; }
    th { color:var(--muted); font-weight:700; }
    @media (max-width: 680px) { button { width:100%; } }
  </style>
</head>
<body>
<main>
  <h1>Kicktipp Bot für secondary</h1>
  <p>Tipps-Codeblock einfügen, überprüfen oder direkt eintragen. Beim Eintragen wird immer überschrieben und direkt gespeichert.</p>

  <section class="card">
    <label>Tipps-Codeblock</label>
    <textarea id="tips" placeholder="Hier bitte den Codeblock einfügen ..."></textarea>
    <div class="actions">
      <button class="secondary" onclick="runBot(false)">Überprüfen</button>
      <button onclick="runBot(true)">Eintragen</button>
    </div>
  </section>

  <section class="card">
    <h2>Ergebnis</h2>
    <div id="status" class="status">Bereit.</div>
    <div id="parsed"></div>
  </section>
</main>
<script>
  const OPTIONS = __OPTIONS__;
  const $ = (id) => document.getElementById(id);

  function setStatus(msg, cls='') {
    const el=$('status');
    el.className='status '+cls;
    el.textContent=msg;
  }

  function payload(save) {
    return {
      text: $('tips').value,
      tipprunde: OPTIONS.tipprunde || '',
      kicktipp_url: OPTIONS.kicktipp_url || '',
      username: OPTIONS.username || '',
      password: '',
      save: !!save,
      overwrite_existing: true
    };
  }

  function renderTips(data) {
    let html = `<p><b>${data.count}</b> Tipps erkannt.</p>`;
    if (data.violations?.length) html += `<p class="bad">${data.violations.join('<br>')}</p>`;
    if (data.tips?.length) {
      html += '<table><thead><tr><th>Spiel</th><th>Tipp</th></tr></thead><tbody>';
      for (const t of data.tips) html += `<tr><td>${escapeHtml(t.home)} – ${escapeHtml(t.away)}</td><td>${t.home_goals}:${t.away_goals}</td></tr>`;
      html += '</tbody></table>';
    }
    $('parsed').innerHTML = html;
  }

  function renderRun(data) {
    const lines = data.results.map(r => `${r.status.padEnd(10)} ${r.line} ${r.detail ? '— '+r.detail : ''}`);
    setStatus(`${data.save_status}\n\n${lines.join('\n')}`, data.saved ? 'ok' : 'warn');
  }

  async function parseTipsOnly() {
    const r = await fetch('/api/parse', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:$('tips').value})
    });
    const data = await r.json();
    if (r.ok) renderTips(data);
    return {ok:r.ok, data};
  }

  async function runBot(shouldSave) {
    try {
      const modeText = shouldSave
        ? 'Trage Tipps ein und speichere direkt ...'
        : 'Überprüfung läuft: Tipps werden testweise eingetragen, aber nicht gespeichert ...';
      setStatus(modeText);
      $('parsed').innerHTML = '';

      const r = await fetch('/api/run', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload(shouldSave))
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Fehler');
      renderRun(data);
      await parseTipsOnly();
    } catch(e) {
      setStatus(e.message || String(e), 'bad');
      await parseTipsOnly();
    }
  }

  function escapeHtml(s) {
    return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
</script>
</body>
</html>
