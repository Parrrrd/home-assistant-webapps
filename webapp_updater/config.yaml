name: "WebApp-Updater"
version: 0.2.12
slug: webapp_updater
description: "Aktualisiert lokale WebApps aus GitHub, protokolliert Updates und öffnet WebApps direkt im Browser."
image: ghcr.io/parrrrd/home-assistant-webapps/webapp-updater-private
webui: "http://[HOST]:[PORT:8160]/"

arch:
  - amd64
  - aarch64

startup: services
boot: auto
init: false

ports:
  8160/tcp: 8160
ports_description:
  8160/tcp: "Versionsverlauf und Wiederherstellung"

hassio_api: true
homeassistant_api: true
hassio_role: manager

map:
  - type: addons
    read_only: false

options:
  check_interval_minutes: 1
  check_interval_seconds: 20
  auto_apply_updates: true
  ui_password: ""
  github_repository: "Parrrrd/home-assistant-webapps-source"
  github_token: ""
  ghcr_username: "Parrrrd"
  ghcr_token: ""

schema:
  check_interval_minutes: int(1,1440)
  check_interval_seconds: int(15,3600)
  auto_apply_updates: bool
  ui_password: password
  github_repository: list(Parrrrd/home-assistant-webapps|Parrrrd/home-assistant-webapps-source)
  github_token: password
  ghcr_username: str
  ghcr_token: password
