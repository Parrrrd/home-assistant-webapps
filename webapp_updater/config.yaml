name: WebApp-Updater
version: 0.1.0
slug: webapp_updater
description: Aktualisiert bestehende lokale WebApps aus GitHub, ohne Daten oder Einstellungen umzuziehen.
image: ghcr.io/parrrrd/home-assistant-webapps/webapp-updater
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
hassio_api: true
hassio_role: manager
map:
  - type: addons
    read_only: false
options:
  check_interval_minutes: 5
  auto_apply_updates: true
schema:
  check_interval_minutes: int(5,1440)
  auto_apply_updates: bool
