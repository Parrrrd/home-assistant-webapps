name: "Stundenplanung"
version: 0.4.6
slug: "stundenplanung"
description: "Arbeitszeiten aus Telegram-Screenshots automatisch per AI lokal oder cloudbasiert erfassen, Sollzeit berechnen und auswerten."
image: ghcr.io/parrrrd/home-assistant-webapps/stundenplanung-private
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8134]/"
ports:
  8134/tcp: 8134
ports_description:
  8134/tcp: "Weboberfläche"
homeassistant_api: true
options:
  web_password: ""
  parser_mode: ""
  ai_provider: ""
  ollama_url: ""
  ollama_model: ""
  gemini_api_key: ""
  gemini_model: ""
  telegram_api_token: ""
  push_notify_on_import: true
  push_notify_service: ""
  push_notify_title: ""
schema:
  web_password: str
  parser_mode: str
  ai_provider: str
  ollama_url: str
  ollama_model: str
  gemini_api_key: password
  gemini_model: str
  telegram_api_token: password
  push_notify_on_import: bool
  push_notify_service: str
  push_notify_title: str
map:
  - type: share
    read_only: false
