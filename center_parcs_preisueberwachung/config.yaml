name: "Center Parcs Preisüberwachung"
version: 0.3.32
slug: "center_parcs_preisueberwachung"
description: "Vergleicht Center-Parcs-Direktpreise mit Felicitas und Benefits und speichert Preisverläufe ausgewählter Unterkünfte."
image: ghcr.io/parrrrd/home-assistant-webapps/center_parcs_preisueberwachung-private
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
webui: "http://[HOST]:[PORT:8102]/"
ports:
  8102/tcp: 8102
ports_description:
  8102/tcp: "Direkter Zugriff auf die Preisüberwachung"
homeassistant_api: true
options:
  interval_hours: 6
  max_history_points: 3000
  default_adults: 2
  default_child_ages: ""
  default_pets: 2
schema:
  interval_hours: "int(1,24)"
  max_history_points: "int(100,10000)"
  default_adults: "int(1,20)"
  default_child_ages: "str"
  default_pets: "int(0,2)"
