name: MOVA Protokoll
version: 0.4.5
slug: mova_protokoll
description: Speichert MOVA-Saug-/Wischvorgänge inkl. Karten-Snapshot und Protokoll.
url: https://github.com/Parrrrd/home-assistant-webapps
image: ghcr.io/parrrrd/home-assistant-webapps/mova_protokoll-private
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
webui: "http://[HOST]:[PORT:8144]/"
homeassistant_api: true
ports:
  8144/tcp: 8144
ports_description:
  8144/tcp: MOVA Protokoll Weboberfläche
map:
  - share:rw
options:
  camera_entity: ""
  mower_entity: ""
  duration_entity: ""
  mode_entity: ""
  retain_count: 20
  poll_seconds: 5
  end_debounce_seconds: 10
  min_auto_duration_seconds: 120
  min_auto_path_points: 0
  min_auto_green_ratio: 0
  active_states: ""
  port: 8144
schema:
  camera_entity: str
  mower_entity: str
  duration_entity: str
  mode_entity: str
  retain_count: int(1,100)
  poll_seconds: int(3,300)
  end_debounce_seconds: int(10,900)
  min_auto_duration_seconds: int(1,7200)
  min_auto_path_points: int(0,10000)
  min_auto_green_ratio: float(0,1)
  active_states: str
  port: int(1024,65535)
